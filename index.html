<!-- index.html -->
<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tea timer</title>
    <link rel="icon" type="image/svg+xml" href="/assets/tea-pot_ink.png" />
    <link rel="stylesheet" href="https://use.typekit.net/zey5ijj.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app" id="app">
      <!-- Чайник + пар -->
      <div class="teapot-wrap" id="teapotWrap">
        <div class="teapot-mask" id="teapotMask">
          <div class="teapot-bg" aria-hidden="true"></div>

          <svg
            class="steam-svg"
            viewBox="0 0 120 60"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <path
              class="steam s1"
              d="M42 55 Q39 40 43 28 Q47 16 41 5"
              fill="none"
              stroke="var(--color-bg)"
              stroke-width="2"
              stroke-linecap="round"
            />
            <path
              class="steam s2"
              d="M55 55 Q51 38 55 25 Q59 12 53 2"
              fill="none"
              stroke="var(--color-bg)"
              stroke-width="2"
              stroke-linecap="round"
            />
            <path
              class="steam s3"
              d="M68 55 Q65 41 69 29 Q73 17 67 6"
              fill="none"
              stroke="var(--color-bg)"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>

          <img
            class="teapot-img"
            id="teapotImg"
            src="assets/tea-pot_brown.png"
            alt="Чайник"
            draggable="false"
          />
        </div>
      </div>

      <!-- Заголовок -->
      <h1 class="title">Tea timer</h1>

      <!-- Отображение времени -->
      <div class="time-display" id="timeDisplay" aria-live="polite">
        3 minutes
      </div>

      <!-- Слайдер -->
      <div class="slider-section" id="sliderSection">
        <div class="slider-wrap">
          <div class="slider-track" aria-hidden="true"></div>
          <div class="slider-thumb" aria-hidden="true"></div>
          <input
            type="range"
            id="minuteSlider"
            min="1"
            max="10"
            step="1"
            value="3"
            aria-label="Choose steep time in minutes"
          />
          <!-- NEW: mobile captions -->
          <div class="range-captions">
            <span>1 minute</span>
            <span>10 minutes</span>
          </div>

          <div class="ticks" aria-hidden="true">
            <span>1</span><span>2</span><span>3</span> <span>4</span
            ><span>5</span><span>6</span><span>7</span><span>8</span
            ><span>9</span><span>10</span>
          </div>
        </div>
      </div>

      <!-- Статус -->
      <div class="status" id="status" aria-live="assertive"></div>

      <!-- Кнопки -->
      <div class="controls" id="controls">
        <button class="btn btn-primary" id="btnStart">Begin the steep</button>
        <div class="secondary-btns" id="secondaryBtns" hidden>
          <button class="btn btn-secondary" id="btnPause">Pause</button>
          <button class="btn btn-ghost" id="btnReset">Reset</button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
